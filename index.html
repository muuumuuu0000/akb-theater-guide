const pill=x=>{if(!x[3])return"";const b=/生誕祭/.test(x[3]),w=/女性限定/.test(x[3]);return `<span class="pill ${b?"b":w?"w":"n"}">${b?"🎂 ":""}${esc(x[3])}</span>`};

function renderGens(){
  const k=kw.replace(/\s|　/g,"");
  const known=GEN.flatMap(g=>g[1].split("・"));
  const G=[...GEN.map(g=>[g[0],g[1].split("・")]),["その他",members.filter(m=>!known.includes(m))]];
  $("gens").innerHTML=G.map(([t,l])=>{const f=l.filter(m=>match(m,k));return f.length?`<div class="gr"><div class="gl">${t}</div><div class="ch">${f.map(m=>`<button class="chip${sel.includes(m)?" on":""}" data-m="${m}">${m}</button>`).join("")}</div></div>`:""}).join("")||`<p class="hint">該当するメンバーがいません</p>`;
}
const EN=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
function renderMonths(){
  $("months2").innerHTML=[mon-1,mon,mon+1].filter(m=>m>=10&&m<=12).map(m=>`<button class="mn${m===mon?" on":""}" data-mo="${m}"${MON[m]?"":" disabled"}>${m===mon?"✓ ":""}${m}月${MON[m]?"":"（未定）"}</button>`).join("");
  $("months").innerHTML=[mon-1,mon,mon+1].filter(m=>m>=10&&m<=12).map(m=>`<button class="mn${m===mon?" on":""}" data-mo="${m}"${MON[m]?"":" disabled"}>${m===mon?"✓ ":""}${m}月${MON[m]?"":"（未定）"}</button>`).join("");
}
function renderRes(){
  $("res").closest("section").style.display=sel.length?"":"none";
  const list=sel.length?MON[mon].filter(x=>x[1]&&(has(x)||outs(x).length)):[];
  $("rt").innerHTML=sel.length?`${sel.length>3?sel.length+"人":sel.join("・")+"さん"}の出演公演<small>${list.filter(has).length}公演</small>${sel.length>1?`<button class="clr" id="clr">選択を解除</button>`:""}`:`推しの出演公演`;
  $("res").innerHTML=!sel.length?"":!list.length?`<p class="hint">この月の出演予定の公演はありません。</p>`:`<div class="tb"><div class="th"><span>公演日</span><span>演目</span><span>開演</span><span></span></div>`+list.map((x,i)=>`<div class="tr${!apps(x).length&&!helps(x).length?" out":""}${resSet.has(i)?" on":""}" data-i="${i}"><span class="b">${dstr(x[0])}</span><span>${nm(x)}</span><span>${x[2]}</span><span class="pc">${pill(x)?`<div class="pr">${pill(x)}</div>`:""}${tags(x)?`<div class="pr">${tags(x)}</div>`:""}</span></div>${resSet.has(i)?`<div class="rowdet">${detHTML(x,true)}</div>`:""}`).join("")+`</div>`;
}
const isToday=d=>{const t=new Date();return t.getFullYear()==2026&&t.getMonth()+1==mon&&t.getDate()==d};
function renderCal(){
  $("ttl").innerHTML=`${mon}<small>月</small><span class="sl">／</span><span class="en">${EN[mon-1]}</span>`;
  const data=MON[mon],first=new Date(2026,mon-1,1).getDay(),days=new Date(2026,mon,0).getDate();
  let h=W.map(w=>`<div class="wh">${w}</div>`).join("")+`<div class="c e"></div>`.repeat(first);
  for(let d=1;d<=days;d++){
    const xs=data.filter(x=>x[0]==d),closed=xs.some(x=>!x[1]),hit=xs.some(has),isSel=d===selDay;
    const badge="";
    const body=closed?`<span class="bar" style="--c:#e4e6ea">休館日</span>`:xs.map(x=>x[2].split("／").map(t=>`<span class="bar" style="--c:${CL[x[1]]}"><span class="bn">${SH[x[1]]}${/生誕祭/.test(x[3])?"🎂":""}</span> <span class="bt">${t}</span></span>`).join("")).join("");
    h+=`<button class="c${hit?" hit":""}${isSel?" sel":""}" data-d="${d}"><span class="n${isToday(d)?" today":""}">${String(d).padStart(2,"0")}</span>${badge}${body}</button>`;
  }
  $("cal").innerHTML=h;
}
const detHTML=(x,bare)=>{const ms=x[4].split("・");const day=x[0];return `<div class="dp2" style="border-left-color:${CL[x[1]]}">${bare?"":`<div class="d1">${mon}月${day}日（${W[wd(day)]}）<span class="d3">${x[2]}<small>開演</small></span></div><h3>${nm(x)}${pill(x)}</h3>`}<div class="d4">${ms.join("、")}</div>${x[5]?`<div class="cg" style="margin:8px 0 0;padding:10px 0 0;border:0;border-top:1px solid var(--bd)"><b>出演メンバー変更</b>${x[5][0]?`<p>出演なし：${x[5][0]}</p>`:""}<p>追加出演：${x[5][1]}</p></div>`:""}</div>`};
function renderDet(){
  const xs=selDay?MON[mon].filter(x=>x[0]==selDay&&x[1]):[];
  $("det").innerHTML=xs.map(x=>detHTML(x)).join("");
}
function renderAll(){renderGens();renderMonths();renderRes();renderCal();renderDet()}
$("kw").addEventListener("input",e=>{kw=e.target.value;renderGens()});
$("gens").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;const m=b.dataset.m;sel=sel.includes(m)?sel.filter(a=>a!==m):[...sel,m];resSet=new Set();renderAll()});
const moClick=e=>{const b=e.target.closest("[data-mo]");if(!b||b.disabled)return;mon=+b.dataset.mo;selDay=null;resSet=new Set();renderAll()};
$("months").addEventListener("click",moClick);$("months2").addEventListener("click",moClick);
$("cal").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;selDay=+b.dataset.d;renderCal();renderDet()});
$("rt").addEventListener("click",e=>{if(e.target.closest("#clr")){sel=[];resSet=new Set();renderAll()}});
$("res").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;const i=+b.dataset.i;resSet.has(i)?resSet.delete(i):resSet.add(i);renderRes()});

renderAll();
</script>
</body>
</html>
